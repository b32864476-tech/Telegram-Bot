name: Build iOS IPA (unsigned)

on:
  push:
    branches: [ios-widget]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Urok.xcodeproj -scheme Urok \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 60

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Urok.app Payload/
          ls Payload/Urok.app/PlugIns || true
          zip -qry Urok.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Urok-ipa
          path: ios/Urok.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-${{ github.run_number }}" ios/Urok.ipa \
            --title "Урок (виджет) сборка ${{ github.run_number }}" \
            --notes "Неподписанный .ipa. Подпиши его в KSign." \
            --target "${{ github.sha }}"
