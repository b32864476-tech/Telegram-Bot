<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Никита Кликер</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: arcade cabinet — counter bar on top, the character as a big round button on the left, upgrade shop rack on the right; stacks on phones. Every changing number sits in a fixed-size slot so nothing shifts while clicking */
:root{
  --ink:#120E33; --ink-2:#1D1850; --ink-3:#2A2468;
  --paper:#F4F0FF; --muted:#A9A2D6;
  --sun:#FFC93C; --coral:#FF5D73; --violet:#8C7BFF; --mint:#5BE3B5;
  --line:rgba(244,240,255,.13);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{overflow-x:hidden;overflow-x:clip;touch-action:manipulation;overflow-anchor:none}
html,body{min-height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden;overflow-x:clip;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg,canvas{-webkit-user-drag:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
button{touch-action:manipulation}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}

/* top */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.logo span{color:var(--sun)}
.score{display:flex;align-items:baseline;gap:16px}
.score .big{display:inline-block;min-width:6.2em;text-align:right;font-family:var(--f-display);font-weight:900;font-size:clamp(24px,4vw,40px);line-height:1;font-variant-numeric:tabular-nums;color:var(--sun);white-space:nowrap}
.score .unit{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.score .ps{font-family:var(--f-mono);font-size:13px;color:var(--paper);white-space:nowrap}
.score .ps b{display:inline-block;min-width:6.5em;text-align:right;color:var(--mint);font-weight:500;font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

/* character switch */
.chars{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.char{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--ink-2);color:var(--paper);border-radius:99px;padding:6px 14px 6px 6px;font-family:var(--f-display);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
.char .av{width:30px;height:30px;border-radius:50%;background:var(--ink-3) center/cover no-repeat;display:grid;place-items:center;font-size:15px}
.char[aria-pressed="true"]{border-color:var(--sun);background:var(--ink-3)}
.char:disabled{cursor:not-allowed;opacity:.55}
.char small{font-family:var(--f-mono);font-weight:500;color:var(--sun)}

/* arena */
.arena{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:8px;min-width:0}
.rank{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.rank b{display:flex;align-items:center;justify-content:center;height:2.5em;line-height:1.15;font-family:var(--f-display);font-weight:900;font-size:clamp(20px,3vw,30px);letter-spacing:-.01em;text-transform:none;color:var(--paper);margin-top:2px;text-wrap:balance}
.stagewrap{position:relative;width:min(380px,62vw);aspect-ratio:1;max-width:100%;margin-block:calc(min(380px,62vw) * .2) calc(min(380px,62vw) * .22)}
.aura{position:absolute;inset:-9%;border-radius:50%;opacity:0;transition:opacity 1s;background:conic-gradient(from 0deg,var(--coral),var(--sun),var(--coral),var(--violet),var(--coral));filter:blur(18px);animation:spin 4s linear infinite}
.lv-aura .aura{opacity:.9}
.lv-space .aura{background:conic-gradient(from 0deg,var(--violet),var(--mint),var(--sun),var(--coral),var(--violet));inset:-14%}
@keyframes spin{to{transform:rotate(360deg)}}
.nikita{position:relative;display:block;width:100%;height:100%;border-radius:50%;border:6px solid var(--sun);padding:0;background:var(--ink-2);cursor:pointer;overflow:hidden;box-shadow:0 14px 0 #B8861A,0 24px 60px rgba(0,0,0,.5);transition:transform .07s ease,box-shadow .07s ease;touch-action:manipulation}
.nikita.hit{transform:translateY(8px) scale(.97);box-shadow:0 6px 0 #B8861A,0 14px 40px rgba(0,0,0,.5)}
.nikita img,.nikita svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nikita img{object-fit:cover}
.layer-s{display:none}
.char-s .layer-n{display:none}
.char-s .layer-s{display:block}
.gear{opacity:0;transform:translateY(-14px) scale(.85);transform-origin:center;transform-box:fill-box;transition:opacity .6s,transform .7s cubic-bezier(.2,1.6,.4,1)}
.lv-glasses .g-glasses,.lv-phones .g-phones,.lv-chain .g-chain,.lv-cap .g-cap,.lv-bolts .g-bolts,.lv-crown .g-crown,.lv-cape .g-cape,.lv-laser .g-laser,.lv-gems .g-gems{opacity:1;transform:none}
.lv-crown .g-cap{opacity:0}
.g-laser line{stroke-dasharray:14 10;animation:dash .4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.g-crown{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{translate:0 -6px}}
.g-bolts path{animation:flick 1.1s steps(2) infinite}
.g-bolts path:nth-child(2){animation-delay:.5s}
@keyframes flick{50%{opacity:.25}}
.g-gems path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.6s ease-in-out infinite}
.g-gems path:nth-child(2n){animation-delay:.6s}.g-gems path:nth-child(3n){animation-delay:1.1s}
@keyframes twinkle{50%{transform:scale(.3);opacity:.4}}
.boost-on .nikita{border-color:var(--mint);box-shadow:0 14px 0 #2B9E78,0 0 60px rgba(91,227,181,.6)}
#fx{position:absolute;inset:-20%;width:140%;height:140%;pointer-events:none;z-index:3}

/* clones */
.clones{position:absolute;inset:0;pointer-events:none;animation:spin 40s linear infinite;z-index:2}
.clone{position:absolute;left:50%;top:50%;width:14%;aspect-ratio:1;margin:-7% 0 0 -7%;border-radius:50%;border:3px solid var(--sun);background:var(--ink-2) center/cover;transform:rotate(var(--a)) translateY(var(--r)) rotate(calc(-1 * var(--a)));box-shadow:0 4px 14px rgba(0,0,0,.4)}
.clone i{position:absolute;inset:0;border-radius:50%;animation:spin 40s linear infinite reverse;background:inherit;background-size:cover}

/* Stantuletsky scene */
.road{stroke-dasharray:30 26;animation:road .5s linear infinite}
@keyframes road{to{stroke-dashoffset:56}}
.speed line{stroke-dasharray:40 220;animation:road2 .7s linear infinite}
.speed line:nth-child(2){animation-delay:.25s}.speed line:nth-child(3){animation-delay:.45s}
@keyframes road2{to{stroke-dashoffset:260}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}
.bob{transform-box:view-box;transform-origin:150px 445px;animation:wheelie 1.6s ease-in-out infinite}
@keyframes wheelie{50%{transform:rotate(-5deg)}}
.bob.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:rotate(-11deg)}}
.flip{transform-box:view-box;transform-origin:230px 330px}
.tr-flip .flip{animation:flip 7s cubic-bezier(.6,0,.4,1) infinite}
@keyframes flip{0%,78%{transform:none}92%{transform:translateY(-70px) rotate(-360deg)}100%{transform:rotate(-360deg)}}
.trk{opacity:0;transition:opacity .6s}
.tr-helmet .t-helmet,.tr-fire .t-fire,.tr-sparks .t-sparks,.tr-trophy .t-trophy,.tr-cape .t-cape{opacity:1}
.tr-neon .rim{stroke:var(--mint);filter:drop-shadow(0 0 6px #5BE3B5)}
.t-fire path{transform-box:fill-box;transform-origin:right center;animation:fire .18s ease-in-out infinite alternate}
.t-fire path:nth-child(2){animation-duration:.24s}
@keyframes fire{to{transform:scaleX(.7) scaleY(1.15)}}
.t-sparks circle{animation:spark .5s linear infinite}
.t-sparks circle:nth-child(2){animation-delay:.12s}.t-sparks circle:nth-child(3){animation-delay:.27s}.t-sparks circle:nth-child(4){animation-delay:.38s}
@keyframes spark{from{transform:translate(0,0);opacity:1}to{transform:translate(-90px,-40px);opacity:0}}

.perclick{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.perclick b{display:inline-block;min-width:5.5em;color:var(--sun);font-weight:500;font-variant-numeric:tabular-nums}

/* evolution track */
.evo{width:100%;max-width:480px}
.evo-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.evo-head span{white-space:nowrap}
.evo-head b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--paper);text-transform:none;letter-spacing:0;font-family:var(--f-body);font-weight:700;font-size:14px}
.bar{height:12px;background:var(--ink-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:inherit;transition:width .3s}
.steps{display:grid;grid-template-columns:repeat(12,1fr);margin-top:12px;gap:2px}
.steps span{text-align:center;font-size:18px;filter:grayscale(1);opacity:.3;transition:opacity .4s,filter .4s}
.steps span.on{filter:none;opacity:1}

/* shop */
.shop{background:var(--ink-2);border-radius:24px;padding:18px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--ink);padding:5px;border-radius:99px;margin-bottom:14px}
.tab{border:0;border-radius:99px;padding:10px 6px;font-family:var(--f-display);font-weight:700;font-size:12px;color:var(--muted);background:transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--sun);color:var(--ink)}
.tab:disabled{cursor:not-allowed;opacity:.5}
.list{display:grid;gap:8px;max-height:640px;overflow-y:auto;overscroll-behavior:contain;padding-right:4px;scrollbar-width:thin}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) 88px;gap:12px;align-items:center;width:100%;min-height:74px;text-align:left;font:inherit;color:inherit;background:var(--ink-3);border:1px solid transparent;border-radius:16px;padding:10px 12px;cursor:pointer;transition:background .2s,border-color .2s,opacity .2s}
.item:hover:not(:disabled){border-color:var(--sun)}
.item:disabled{cursor:not-allowed;opacity:.45}
.item.locked{opacity:.25}
.item .ic{width:48px;height:48px;border-radius:14px;background:var(--ink);display:grid;place-items:center;font-size:24px}
.item .t,.item .d,.item .own,.item .cost{display:block}
.item .t{font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1.2}
.item .d{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.item .d b{color:var(--mint);font-weight:700}
.item .r{text-align:right;font-variant-numeric:tabular-nums}
.item .cost{font-family:var(--f-mono);font-size:13px;color:var(--sun);white-space:nowrap}
.item .own{font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1.1;color:var(--paper);opacity:.85}
.item.flash{animation:flash .4s}
@keyframes flash{40%{background:var(--sun);color:var(--ink)}}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:12px;color:var(--muted)}
.reset{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer;min-width:9.5em}
.reset.armed{border-color:var(--coral);color:var(--coral)}

/* golden star */
#star{position:fixed;z-index:30;width:72px;height:72px;border:0;background:none;cursor:pointer;font-size:58px;line-height:72px;padding:0;filter:drop-shadow(0 0 16px var(--sun));animation:float 2s ease-in-out infinite}
@keyframes float{50%{translate:0 -12px}}
.boostbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--mint);color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:14px;padding:10px 18px;border-radius:99px;box-shadow:0 8px 30px rgba(91,227,181,.5);white-space:nowrap;pointer-events:none}

/* toast */
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-180%);z-index:40;background:var(--paper);color:var(--ink);border-radius:18px;padding:14px 22px;display:flex;gap:14px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.2,1.4,.4,1);width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.toast .e{font-size:32px}
.toast small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6A5FB0}
.toast b{font-family:var(--f-display);font-weight:900;font-size:17px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="top">
    <div class="logo">НИКИТА <span>КЛИКЕР</span></div>
    <div class="score">
      <div><span class="big" id="total">0</span><span class="unit">крутости</span></div>
      <div class="ps"><b id="ps">0</b> /с</div>
    </div>
  </header>

  <div class="grid">
    <section class="arena" id="arena" aria-label="Персонаж">
      <div class="chars">
        <button class="char" id="ch-n" type="button" aria-pressed="true"><span class="av" style="background-image:url(photo.jpg)"></span>Никита</button>
        <button class="char" id="ch-s" type="button" aria-pressed="false" disabled><span class="av" id="av-s">🔒</span>Никита Стантулецкий <small id="ch-s-lock">15 млн</small></button>
      </div>
      <div class="rank">Звание<b id="rank">Просто Никита</b></div>
      <div class="stagewrap" id="stagewrap">
        <div class="aura"></div>
        <div class="clones" id="clones"></div>
        <button class="nikita" id="nikita" type="button" aria-label="Кликнуть по персонажу">
          <img class="layer-n" src="photo.jpg" alt="" draggable="false">
          <svg class="layer-n" viewBox="0 0 480 480" aria-hidden="true">
            <defs>
              <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".5" stop-color="#FFC93C"/><stop offset="1" stop-color="#C98A12"/></linearGradient>
              <radialGradient id="glow"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#FF5D73"/><stop offset="1" stop-color="#FF5D73" stop-opacity="0"/></radialGradient>
            </defs>
            <g class="gear g-cape">
              <path d="M128 330 Q90 400 40 480 L150 480 Q150 400 165 336Z" fill="#E0304D"/>
              <path d="M352 330 Q390 400 440 480 L330 480 Q330 400 315 336Z" fill="#E0304D"/>
              <path d="M128 330 Q90 400 40 480" fill="none" stroke="#FFC93C" stroke-width="5"/>
              <path d="M352 330 Q390 400 440 480" fill="none" stroke="#FFC93C" stroke-width="5"/>
            </g>
            <g class="gear g-chain">
              <path d="M168 340 Q238 420 312 340" fill="none" stroke="url(#gold)" stroke-width="9" stroke-dasharray="2 13" stroke-linecap="round"/>
              <circle cx="240" cy="392" r="26" fill="url(#gold)" stroke="#8A5A00" stroke-width="3"/>
              <text x="240" y="402" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="28" fill="#5A3A00">Н</text>
            </g>
            <g class="gear g-phones">
              <path d="M150 200 Q140 60 240 52 Q340 60 330 200" fill="none" stroke="#1B1640" stroke-width="14" stroke-linecap="round"/>
              <path d="M150 200 Q140 60 240 52 Q340 60 330 200" fill="none" stroke="#8C7BFF" stroke-width="4" stroke-linecap="round"/>
              <rect x="128" y="168" width="40" height="66" rx="16" fill="#FF5D73" stroke="#1B1640" stroke-width="5"/>
              <rect x="312" y="168" width="40" height="66" rx="16" fill="#FF5D73" stroke="#1B1640" stroke-width="5"/>
            </g>
            <g class="gear g-cap">
              <path d="M158 112 Q156 40 240 36 Q324 40 322 112 Z" fill="#FF5D73" stroke="#1B1640" stroke-width="4"/>
              <rect x="152" y="102" width="176" height="16" rx="6" fill="#1B1640"/>
              <circle cx="240" cy="38" r="7" fill="#1B1640"/>
              <text x="240" y="92" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="30" fill="#F4F0FF">N</text>
            </g>
            <g class="gear g-glasses">
              <path d="M172 158 h66 v14 q0 30 -33 30 q-33 0 -33 -30z" fill="#0B0920"/>
              <path d="M240 158 h66 v14 q0 30 -33 30 q-33 0 -33 -30z" fill="#0B0920"/>
              <rect x="164" y="154" width="150" height="9" rx="4" fill="#0B0920"/>
              <path d="M182 166 l14 0 M250 166 l14 0" stroke="#8C7BFF" stroke-width="5" stroke-linecap="round" opacity=".8"/>
            </g>
            <g class="gear g-laser">
              <circle cx="205" cy="178" r="20" fill="url(#glow)"/>
              <circle cx="273" cy="178" r="20" fill="url(#glow)"/>
              <line x1="205" y1="178" x2="-40" y2="300" stroke="#FF5D73" stroke-width="7" stroke-linecap="round"/>
              <line x1="273" y1="178" x2="520" y2="300" stroke="#FF5D73" stroke-width="7" stroke-linecap="round"/>
            </g>
            <g class="gear g-bolts">
              <path d="M78 90 L52 150 H78 L62 206 L112 132 H84 L104 90Z" fill="#FFC93C" stroke="#1B1640" stroke-width="4" stroke-linejoin="round"/>
              <path d="M402 90 L376 150 H402 L386 206 L436 132 H408 L428 90Z" fill="#FFC93C" stroke="#1B1640" stroke-width="4" stroke-linejoin="round"/>
            </g>
            <g class="gear g-crown">
              <path d="M170 82 L182 22 L212 58 L240 12 L268 58 L298 22 L310 82 Z" fill="url(#gold)" stroke="#8A5A00" stroke-width="3" stroke-linejoin="round"/>
              <rect x="168" y="78" width="144" height="16" rx="5" fill="url(#gold)" stroke="#8A5A00" stroke-width="3"/>
              <circle cx="240" cy="50" r="8" fill="#FF5D73"/><circle cx="204" cy="66" r="6" fill="#8C7BFF"/><circle cx="276" cy="66" r="6" fill="#5BE3B5"/>
            </g>
            <g class="gear g-gems" fill="#E9F7FF" stroke="#8C7BFF" stroke-width="2">
              <path d="M120 250 l6 -16 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6z"/>
              <path d="M352 250 l6 -16 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6z"/>
              <path d="M110 120 l4 -11 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4z"/>
              <path d="M362 112 l4 -11 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4z"/>
              <path d="M190 300 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z"/>
              <path d="M286 300 l3 -9 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3z"/>
            </g>
          </svg>

          <svg class="layer-s" viewBox="0 0 480 480" aria-hidden="true">
            <defs>
              <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3B2A8C"/><stop offset=".6" stop-color="#C2477A"/><stop offset="1" stop-color="#FF9A62"/></linearGradient>
              <linearGradient id="gold2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset="1" stop-color="#C98A12"/></linearGradient>
            </defs>
            <rect width="480" height="480" fill="url(#sky)"/>
            <circle cx="350" cy="250" r="70" fill="#FFC93C" opacity=".85"/>
            <path d="M0 330 V260 h40 v-40 h50 v60 h30 v-90 h60 v70 h40 v-30 h50 v50 h40 v-80 h60 v60 h40 v-20 h70 V330Z" fill="#2A1F5C" opacity=".85"/>
            <rect y="330" width="480" height="150" fill="#1B1640"/>
            <line class="road" x1="0" y1="470" x2="480" y2="470" stroke="#FFC93C" stroke-width="6"/>
            <g class="speed" stroke="#F4F0FF" stroke-width="3" stroke-linecap="round" opacity=".5">
              <line x1="480" y1="150" x2="0" y2="150"/><line x1="480" y1="205" x2="0" y2="205"/><line x1="480" y1="385" x2="0" y2="385"/>
            </g>
            <g class="trk t-fire">
              <path d="M98 432 Q50 418 8 440 Q48 444 98 450Z" fill="#FF5D73"/>
              <path d="M98 436 Q66 428 36 442 Q66 446 98 448Z" fill="#FFC93C"/>
            </g>
            <g class="trk t-sparks" fill="#FFE38A">
              <circle cx="140" cy="444" r="4"/><circle cx="146" cy="446" r="3"/><circle cx="136" cy="442" r="3"/><circle cx="150" cy="444" r="4"/>
            </g>
            <g class="flip">
            <g class="bob" id="bob">
              <g transform="translate(150 390) rotate(-22)">
                <!-- cape -->
                <path class="trk t-cape" d="M64 -136 Q10 -120 -40 -70 Q0 -90 30 -80 Q20 -60 -10 -30 Q40 -60 56 -96Z" fill="#E0304D"/>
                <!-- wheels -->
                <g class="wheel"><circle class="rim" r="55" fill="none" stroke="#F4F0FF" stroke-width="8"/><circle r="47" fill="none" stroke="#120E33" stroke-width="5"/><path d="M-47 0H47M0 -47V47M-33 -33L33 33M-33 33L33 -33" stroke="#A9A2D6" stroke-width="2.5"/><circle r="7" fill="#FFC93C"/></g>
                <g transform="translate(150 0)"><g class="wheel"><circle class="rim" r="55" fill="none" stroke="#F4F0FF" stroke-width="8"/><circle r="47" fill="none" stroke="#120E33" stroke-width="5"/><path d="M-47 0H47M0 -47V47M-33 -33L33 33M-33 33L33 -33" stroke="#A9A2D6" stroke-width="2.5"/><circle r="7" fill="#FFC93C"/></g></g>
                <!-- frame -->
                <g fill="none" stroke="#FF5D73" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M0 0 L65 8 L48 -58 Z"/>
                  <path d="M65 8 L128 -50 L48 -58"/>
                  <path d="M128 -50 L150 0"/>
                </g>
                <path d="M128 -50 L122 -82 L146 -88" fill="none" stroke="#F4F0FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M34 -64 H62" stroke="#120E33" stroke-width="10" stroke-linecap="round"/>
                <circle cx="65" cy="8" r="10" fill="#FFC93C"/>
                <!-- rider -->
                <path d="M46 -72 L96 -54 L72 14" fill="none" stroke="#2E2A4A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M72 14 h20" stroke="#F4F0FF" stroke-width="10" stroke-linecap="round"/>
                <path d="M46 -72 L70 -142" stroke="#0E0B22" stroke-width="34" stroke-linecap="round"/>
                <path d="M70 -132 L112 -104 L142 -88" fill="none" stroke="#0E0B22" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="52" y="-104" transform="rotate(-70 52 -104)" font-family="Unbounded, sans-serif" font-size="9" font-weight="700" fill="#F4F0FF">MCKENZIE</text>
                <g transform="translate(78 -184) rotate(16)">
                  <image href="head.png" x="-34" y="-45" width="68" height="90"/>
                  <g class="trk t-helmet">
                    <path d="M-38 -4 Q-40 -56 0 -58 Q40 -56 40 -4 Z" fill="#FF5D73" stroke="#1B1640" stroke-width="4"/>
                    <path d="M-12 -56 L-8 -8 M12 -56 L10 -8" stroke="#F4F0FF" stroke-width="5"/>
                    <path d="M40 -10 h14" stroke="#1B1640" stroke-width="6" stroke-linecap="round"/>
                  </g>
                </g>
              </g>
            </g>
            </g>
            <g class="trk t-trophy">
              <rect x="270" y="58" width="160" height="40" rx="20" fill="#1B1640" opacity=".85"/>
              <text x="350" y="84" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="15" fill="url(#gold2)">🏆 РЕКОРД</text>
            </g>
          </svg>
        </button>
        <canvas id="fx" aria-hidden="true"></canvas>
      </div>
      <div class="perclick">За клик: <b id="pc">1</b></div>
      <div class="evo">
        <div class="evo-head"><span id="evoLabel">Следующий аксессуар</span><b id="next">Тёмные очки</b></div>
        <div class="bar"><i id="evobar"></i></div>
        <div class="steps" id="steps"></div>
      </div>
    </section>

    <aside class="shop" aria-label="Магазин улучшений">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-click" aria-selected="true" type="button">Клик</button>
        <button class="tab" role="tab" id="tab-auto" aria-selected="false" type="button">Авто</button>
        <button class="tab" role="tab" id="tab-trick" aria-selected="false" type="button" disabled>🔒 Трюки</button>
      </div>
      <div class="list" id="list"></div>
      <div class="shop-foot">
        <span id="clicks">Кликов: 0</span>
        <button class="reset" id="reset" type="button">Начать заново</button>
      </div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"><span class="e" id="toastE">🕶️</span><div><small id="toastS">Никита стал круче</small><b id="toastT">Тёмные очки</b></div></div>
<button id="star" type="button" aria-label="Золотая звезда: бонус ×7" hidden>⭐</button>
<div class="boostbar" id="boostbar" hidden></div>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const UNLOCK_S = 15000000;
  const PHOTO = 'photo.jpg';

  const CLICK = [
    { id:'hair',    ic:'💇', t:'Причёска стильнее',   d:'Чёлка ложится идеально',  add:1,      cost:15 },
    { id:'hoodie',  ic:'🧥', t:'Худи McKenzie',        d:'Чёрное, как надо',        add:5,      cost:180 },
    { id:'sneak',   ic:'👟', t:'Кроссовки-ракеты',     d:'Быстрее звонка с урока',  add:12,     cost:900 },
    { id:'gloves',  ic:'🧤', t:'Перчатки силы',        d:'Каждый клик — удар',      add:25,     cost:2500 },
    { id:'phone',   ic:'📱', t:'Новый смартфон',       d:'Камера на 200 Мп',        add:60,     cost:8000 },
    { id:'look',    ic:'😎', t:'Взгляд легенды',       d:'Смотрит — и все в шоке',  add:140,    cost:35000 },
    { id:'mic',     ic:'🎤', t:'Микрофон рэпера',      d:'Читает быстрее всех',     add:400,    cost:150000 },
    { id:'aura',    ic:'🔥', t:'Аура победителя',      d:'Горит даже в дождь',      add:900,    cost:500000 },
    { id:'skate',   ic:'🛹', t:'Золотой скейт',        d:'Кикфлип с первой попытки',add:2500,   cost:2000000 },
    { id:'cosmic',  ic:'🌌', t:'Космический палец',    d:'Кликает сквозь время',    add:7000,   cost:9000000 },
    { id:'quantum', ic:'⚛️', t:'Квантовый клик',       d:'Кликает во всех мирах',   add:40000,  cost:80000000 },
    { id:'god',     ic:'🌟', t:'Палец бога',           d:'Один клик — новая звезда',add:250000, cost:900000000 }
  ];
  const AUTO = [
    { id:'fan',    ic:'🙋', t:'Фанат из класса',      d:'Хлопает без остановки',   add:1,       cost:50 },
    { id:'tg',     ic:'💬', t:'Группа в Telegram',    d:'Стикеры с Никитой',       add:8,       cost:600 },
    { id:'granny', ic:'👵', t:'Бабушка хвалит',       d:'«Какой же ты молодец»',   add:25,      cost:2500 },
    { id:'tiktok', ic:'🎬', t:'Тренд в ТикТоке',      d:'Миллион просмотров',      add:60,      cost:7500 },
    { id:'clone',  ic:'👯', t:'Клон Никиты',          d:'Ещё один Никита рядом',   add:150,     cost:20000 },
    { id:'club',   ic:'🏟️', t:'Фан-клуб района',      d:'Скандируют имя',          add:400,     cost:90000 },
    { id:'stream', ic:'🎮', t:'Стрим на весь мир',    d:'Донаты рекой',            add:1200,    cost:400000 },
    { id:'tv',     ic:'📺', t:'Шоу на ТВ',            d:'Прайм-тайм каждый день',  add:2800,    cost:1200000 },
    { id:'statue', ic:'🗿', t:'Памятник Никите',      d:'На главной площади',      add:8000,    cost:5000000 },
    { id:'sat',    ic:'🛰️', t:'Спутник «Никита-1»',   d:'Транслирует крутость',    add:20000,   cost:18000000 },
    { id:'land',   ic:'🎢', t:'Никита-лэнд',          d:'Парк аттракционов',       add:120000,  cost:200000000 },
    { id:'planet', ic:'🪐', t:'Планета Никита',       d:'Своя орбита и луна',      add:900000,  cost:3000000000 }
  ];
  const TRICK = [
    { id:'helmet', ic:'🪖', t:'Шлем чемпиона',        d:'Защита и стиль',          add:20000,    cost:15000000,  kind:'click', cls:'tr-helmet' },
    { id:'fire',   ic:'🔥', t:'Огненный след',        d:'Асфальт плавится',        add:150000,   cost:25000000,  kind:'auto',  cls:'tr-fire' },
    { id:'sparks', ic:'✨', t:'Искры из-под колеса',  d:'Как болгарка',            add:100000,   cost:60000000,  kind:'click', cls:'tr-sparks' },
    { id:'neon',   ic:'💡', t:'Неоновые колёса',      d:'Светятся в темноте',      add:1000000,  cost:150000000, kind:'auto',  cls:'tr-neon' },
    { id:'cape',   ic:'🦸', t:'Плащ каскадёра',       d:'Развевается на ветру',    add:700000,   cost:300000000, kind:'click', cls:'tr-cape' },
    { id:'flip',   ic:'🔄', t:'Сальто назад',         d:'Прямо на заднем колесе',  add:1500000,  cost:400000000, kind:'click', cls:'tr-flip' },
    { id:'record', ic:'🏆', t:'Мировой рекорд',       d:'10 км на заднем колесе',  add:10000000, cost:1500000000,kind:'auto',  cls:'tr-trophy' }
  ];
  const ALL = [...CLICK.map(u => ({ ...u, kind:'click' })), ...AUTO.map(u => ({ ...u, kind:'auto' })), ...TRICK];
  const byId = Object.fromEntries(ALL.map(u => [u.id, u]));

  const LEVELS = [
    { at:0,        e:'🙂', t:'Просто Никита',     cls:'',           rank:'Просто Никита' },
    { at:100,      e:'🕶️', t:'Тёмные очки',       cls:'lv-glasses', rank:'Никита в очках' },
    { at:500,      e:'🎧', t:'Наушники',          cls:'lv-phones',  rank:'Никита на волне' },
    { at:1000,     e:'⛓️', t:'Золотая цепь',      cls:'lv-chain',   rank:'Модный Никита' },
    { at:5000,     e:'🧢', t:'Кепка',             cls:'lv-cap',     rank:'Уличный Никита' },
    { at:10000,    e:'🔥', t:'Огненная аура',     cls:'lv-aura',    rank:'Пылающий Никита' },
    { at:50000,    e:'⚡', t:'Молнии',            cls:'lv-bolts',   rank:'Грозовой Никита' },
    { at:100000,   e:'👑', t:'Корона',            cls:'lv-crown',   rank:'Король Никита' },
    { at:500000,   e:'🦸', t:'Плащ героя',        cls:'lv-cape',    rank:'Супер-Никита' },
    { at:1000000,  e:'🔴', t:'Лазерные глаза',    cls:'lv-laser',   rank:'Никита-терминатор' },
    { at:5000000,  e:'💎', t:'Бриллианты',        cls:'lv-gems',    rank:'Бриллиантовый Никита' },
    { at:10000000, e:'🌌', t:'Космический Никита',cls:'lv-space',   rank:'Повелитель вселенной' },
    { at:UNLOCK_S, e:'🚲', t:'Никита Стантулецкий', cls:'',         rank:'Повелитель вселенной' }
  ];

  const fresh = () => ({ score:0, earned:0, clicks:0, own:{}, lvl:0, char:'n' });
  let S = fresh();
  try { const raw = localStorage.getItem('nikita-clicker'); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  const hot = window.claude && window.claude.hot;
  if (hot && hot.data && hot.data.S) S = Object.assign(fresh(), hot.data.S);
  if (hot && hot.snapshot) hot.snapshot(() => ({ S }));
  const save = () => { try { localStorage.setItem('nikita-clicker', JSON.stringify(S)); } catch (e) {} };
  // recompute level silently (level table changed between versions)
  S.lvl = 0; while (S.lvl + 1 < LEVELS.length && S.earned >= LEVELS[S.lvl + 1].at) S.lvl++;
  const unlockedS = () => S.earned >= UNLOCK_S;
  if (!unlockedS()) S.char = 'n';

  let boostUntil = 0;
  const own = id => S.own[id] || 0;
  const price = u => Math.ceil(u.cost * Math.pow(1.15, own(u.id)));
  const mult = () => (performance.now() < boostUntil ? 7 : 1);
  const charMult = () => (S.char === 's' ? 3 : 1);
  const perClick = () => (1 + ALL.filter(u => u.kind === 'click').reduce((s, u) => s + u.add * own(u.id), 0)) * mult() * charMult();
  const perSec = () => ALL.filter(u => u.kind === 'auto').reduce((s, u) => s + u.add * own(u.id), 0) * mult();

  const fmt = n => {
    n = Math.floor(n);
    const u = [[1e12,1e12,' трлн'],[1e9,1e9,' млрд'],[1e6,1e6,' млн'],[1e4,1e3,' тыс.']];
    for (const [lim, v, s] of u) if (n >= lim) return (n / v).toLocaleString('ru-RU', { maximumFractionDigits: n / v < 100 ? 2 : 1 }) + s;
    return n.toLocaleString('ru-RU');
  };

  // shop
  let tab = 'click';
  const list = $('list');
  const listFor = t => (t === 'click' ? CLICK : t === 'auto' ? AUTO : TRICK);
  const renderShop = () => {
    list.innerHTML = listFor(tab).map(u0 => { const u = byId[u0.id]; return `
      <button class="item" type="button" data-id="${u.id}">
        <span class="ic" aria-hidden="true">${u.ic}</span>
        <span><span class="t">${u.t}</span><span class="d">${u.d} · <b>+${fmt(u.add)}${u.kind === 'click' ? ' за клик' : '/с'}</b></span></span>
        <span class="r"><span class="own">${own(u.id)}</span><span class="cost">${fmt(price(u))}</span></span>
      </button>`; }).join('');
    update();
  };
  const setTab = t => {
    tab = t;
    ['click','auto','trick'].forEach(k => $('tab-' + k).setAttribute('aria-selected', k === t));
    list.scrollTop = 0; renderShop();
  };
  $('tab-click').onclick = () => setTab('click');
  $('tab-auto').onclick = () => setTab('auto');
  $('tab-trick').onclick = () => setTab('trick');
  list.addEventListener('pointerdown', e => e.preventDefault()); // no focus jump / no scroll on tap
  list.addEventListener('click', e => {
    const b = e.target.closest('.item'); if (!b) return;
    const u = byId[b.dataset.id], p = price(u);
    if (S.score < p) return;
    S.score -= p; S.own[u.id] = own(u.id) + 1; save();
    b.querySelector('.own').textContent = own(u.id);
    b.querySelector('.cost').textContent = fmt(price(u));
    b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
    applyGear(); update();
  });

  // levels, accessories, clones, tricks
  const app = $('app'), steps = $('steps');
  steps.innerHTML = LEVELS.slice(1).map(l => `<span title="${l.t}">${l.e}</span>`).join('');
  const clonesEl = $('clones'), stagewrap = $('stagewrap');
  let cloneCount = -1;
  const layoutClones = () => {
    const n = Math.min(10, own('clone'));
    if (n !== cloneCount) {
      cloneCount = n;
      clonesEl.innerHTML = Array.from({ length: n }, (_, i) => `<span class="clone" style="--a:${(360 / n) * i}deg"><i style="background-image:url(${PHOTO})"></i></span>`).join('');
    }
    clonesEl.style.setProperty('--r', (-stagewrap.offsetWidth * 0.62) + 'px');
  };
  const applyGear = () => {
    LEVELS.forEach((l, i) => l.cls && app.classList.toggle(l.cls, i <= S.lvl));
    [...steps.children].forEach((s, i) => s.classList.toggle('on', i + 1 <= S.lvl));
    TRICK.forEach(t => app.classList.toggle(t.cls, own(t.id) > 0));
    app.classList.toggle('char-s', S.char === 's');
    const u = unlockedS();
    $('ch-s').disabled = !u; $('ch-s-lock').hidden = u;
    $('av-s').textContent = u ? '🚲' : '🔒';
    $('tab-trick').disabled = !u; $('tab-trick').textContent = u ? '🚲 Трюки' : '🔒 Трюки';
    $('ch-n').setAttribute('aria-pressed', S.char === 'n'); $('ch-s').setAttribute('aria-pressed', S.char === 's');
    if (S.char === 's') {
      const tricks = TRICK.filter(t => own(t.id) > 0).length;
      $('rank').textContent = tricks >= TRICK.length ? 'Легенда двух колёс' : tricks >= 3 ? 'Король заднего колеса' : 'Никита Стантулецкий';
    } else $('rank').textContent = LEVELS[S.lvl].rank;
    layoutClones();
  };
  addEventListener('resize', layoutClones);
  const setChar = c => { if (c === 's' && !unlockedS()) return; S.char = c; save(); applyGear(); update(); };
  $('ch-n').onclick = () => setChar('n');
  $('ch-s').onclick = () => setChar('s');

  let toastT;
  const toast = (e, t, s) => {
    $('toastE').textContent = e; $('toastT').textContent = t; $('toastS').textContent = s || 'Никита стал круче';
    $('toast').classList.add('show'); clearTimeout(toastT);
    toastT = setTimeout(() => $('toast').classList.remove('show'), 3400);
  };
  const checkLevel = () => {
    let l = S.lvl;
    while (l + 1 < LEVELS.length && S.earned >= LEVELS[l + 1].at) l++;
    if (l !== S.lvl) {
      S.lvl = l;
      if (LEVELS[l].at === UNLOCK_S) toast('🚲', 'Никита Стантулецкий', 'Новый персонаж открыт');
      else toast(LEVELS[l].e, LEVELS[l].t);
      applyGear(); burst(null, 80, true); save();
    }
  };

  // update UI
  const update = () => {
    $('total').textContent = fmt(S.score);
    $('ps').textContent = fmt(perSec());
    $('pc').textContent = fmt(perClick());
    $('clicks').textContent = 'Кликов: ' + S.clicks.toLocaleString('ru-RU');
    list.querySelectorAll('.item').forEach(b => {
      const u = byId[b.dataset.id], p = price(u);
      const dis = S.score < p; if (b.disabled !== dis) b.disabled = dis;
      b.classList.toggle('locked', own(u.id) === 0 && S.earned < u.cost * 0.4);
    });
    const nx = LEVELS[S.lvl + 1];
    if (nx) {
      const pv = LEVELS[S.lvl].at;
      $('evoLabel').textContent = nx.at === UNLOCK_S ? 'Новый персонаж' : 'Следующий аксессуар';
      $('next').textContent = `${nx.e} ${nx.t} — ${fmt(nx.at)}`;
      $('evobar').style.width = Math.min(100, (S.earned - pv) / (nx.at - pv) * 100) + '%';
    } else {
      const done = TRICK.filter(t => own(t.id) > 0).length;
      $('evoLabel').textContent = 'Трюки Стантулецкого';
      $('next').textContent = `${done} из ${TRICK.length} открыто`;
      $('evobar').style.width = (done / TRICK.length * 100) + '%';
    }
  };
  const gain = n => { S.score += n; S.earned += n; checkLevel(); };

  // particles
  const fx = $('fx'), f = fx.getContext('2d');
  let dpr = 1, parts = [], running = false;
  const sizeFx = () => { dpr = Math.min(devicePixelRatio || 1, 2); const r = fx.getBoundingClientRect(); fx.width = r.width * dpr; fx.height = r.height * dpr; };
  sizeFx(); addEventListener('resize', sizeFx);
  const COLS = ['#FFC93C', '#FF5D73', '#F4F0FF', '#8C7BFF', '#5BE3B5'];
  const tick = () => {
    f.clearRect(0, 0, fx.width, fx.height);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += (p.txt ? .05 : .3) * dpr; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      f.save(); f.globalAlpha = Math.min(1, p.life / 25); f.translate(p.x, p.y); f.rotate(p.rot);
      if (p.txt) { f.font = `900 ${p.size * dpr}px Unbounded, sans-serif`; f.textAlign = 'center'; f.lineWidth = 5 * dpr; f.strokeStyle = '#120E33'; f.strokeText(p.txt, 0, 0); f.fillStyle = p.col; f.fillText(p.txt, 0, 0); }
      else { f.fillStyle = p.col; f.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); }
      f.restore();
    }
    if (parts.length) requestAnimationFrame(tick); else running = false;
  };
  const burst = (pt, n, big) => {
    if (reduce) return;
    const r = fx.getBoundingClientRect();
    const x = pt ? (pt.x - r.left) * dpr : fx.width / 2, y = pt ? (pt.y - r.top) * dpr : fx.height / 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (big ? 6 + Math.random() * 12 : 2 + Math.random() * 6) * dpr;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3 * dpr, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, s: (5 + Math.random() * 7) * dpr, col: COLS[i % 5], life: 50 + Math.random() * 30 });
    }
    if (parts.length > 400) parts.splice(0, parts.length - 400);
    if (!running) { running = true; requestAnimationFrame(tick); }
  };
  const floatText = (pt, txt, col) => {
    if (reduce) return;
    const r = fx.getBoundingClientRect();
    parts.push({ x: (pt.x - r.left) * dpr, y: (pt.y - r.top) * dpr, vx: (Math.random() - .5) * 1.5 * dpr, vy: -3.2 * dpr, rot: (Math.random() - .5) * .3, vr: 0, txt, col, size: 26, life: 55 });
    if (!running) { running = true; requestAnimationFrame(tick); }
  };

  // click
  const nk = $('nikita'), bob = $('bob');
  const doClick = pt => {
    const n = perClick(); gain(n); S.clicks++;
    floatText(pt, '+' + fmt(n), mult() > 1 ? '#5BE3B5' : '#FFC93C');
    burst(pt, 8, false);
    nk.classList.remove('hit'); void nk.offsetWidth; nk.classList.add('hit');
    setTimeout(() => nk.classList.remove('hit'), 80);
    if (S.char === 's') { bob.classList.remove('pop'); void bob.getBoundingClientRect(); bob.classList.add('pop'); clearTimeout(bob._t); bob._t = setTimeout(() => bob.classList.remove('pop'), 360); }
    update();
  };
  nk.addEventListener('pointerdown', e => { e.preventDefault(); doClick({ x: e.clientX, y: e.clientY }); });
  nk.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const r = nk.getBoundingClientRect(); doClick({ x: r.left + r.width / 2, y: r.top + r.height / 3 }); }
  });
  nk.addEventListener('click', e => e.preventDefault());
  document.addEventListener('contextmenu', e => { if (e.target.closest('.nikita, .clone')) e.preventDefault(); });
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault());

  // golden star
  const star = $('star'), bb = $('boostbar');
  const spawnStar = () => {
    if (S.earned < 200) return schedule();
    star.style.left = `calc(${Math.random()} * (100vw - 96px) + 12px)`;
    star.style.top = `calc(${Math.random()} * (100vh - 180px) + 90px)`;
    star.hidden = false;
    setTimeout(() => { star.hidden = true; schedule(); }, 9000);
  };
  const schedule = () => setTimeout(spawnStar, 40000 + Math.random() * 50000);
  star.addEventListener('pointerdown', e => {
    e.preventDefault(); star.hidden = true; boostUntil = performance.now() + 15000;
    app.classList.add('boost-on'); burst(null, 60, true);
    toast('⭐', 'Буст ×7 на 15 секунд', 'Звезда поймана');
  });
  schedule();

  // reset (two-step, no confirm())
  const rs = $('reset'); let armT;
  rs.addEventListener('click', () => {
    if (!rs.classList.contains('armed')) { rs.classList.add('armed'); rs.textContent = 'Точно сбросить?'; armT = setTimeout(() => { rs.classList.remove('armed'); rs.textContent = 'Начать заново'; }, 3000); return; }
    clearTimeout(armT); S = fresh(); save(); applyGear(); setTab('click');
    rs.classList.remove('armed'); rs.textContent = 'Начать заново';
  });

  // game loop + background
  let last = performance.now(), acc = 0;
  const bg = $('bg'), g = bg.getContext('2d'); let W, H;
  const sizeBg = () => { W = bg.width = innerWidth * dpr; H = bg.height = innerHeight * dpr; };
  sizeBg(); addEventListener('resize', sizeBg);
  const stars = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), z: Math.random() }));
  const loop = now => {
    const dt = Math.min(1, (now - last) / 1000); last = now;
    const ps = perSec(); if (ps) gain(ps * dt);
    if (now >= boostUntil && app.classList.contains('boost-on')) app.classList.remove('boost-on');
    const showBB = now < boostUntil; if (bb.hidden === showBB) bb.hidden = !showBB;
    if (showBB) bb.textContent = `⭐ Буст ×7 · ${Math.ceil((boostUntil - now) / 1000)} с`;
    acc += dt; if (acc > .1) { acc = 0; update(); }
    g.clearRect(0, 0, W, H);
    const t = now / 1000;
    [['255,93,115', .45, .11, 0], ['255,201,60', .35, .09, 2], ['140,123,255', .55, .06, 4]].forEach(([c, r, s, p]) => {
      const x = W * (.5 + .4 * Math.sin(t * s + p)), y = H * (.5 + .4 * Math.cos(t * s * 1.2 + p)), R = Math.max(W, H) * r;
      const gr = g.createRadialGradient(x, y, 0, x, y, R); gr.addColorStop(0, `rgba(${c},${.1 + Math.min(S.lvl, 12) * .01})`); gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    });
    if (S.lvl >= 11) {
      g.fillStyle = '#F4F0FF';
      for (const st of stars) {
        st.y += (reduce ? 0 : .0004 + st.z * .0012); if (st.y > 1) st.y = 0;
        g.globalAlpha = .3 + st.z * .7; g.fillRect(st.x * W, st.y * H, (1 + st.z * 2) * dpr, (1 + st.z * 2) * dpr);
      }
      g.globalAlpha = 1;
    }
    requestAnimationFrame(loop);
  };
  setInterval(save, 5000);
  addEventListener('pagehide', save);

  applyGear(); renderShop(); requestAnimationFrame(loop);

  // test hook
  window.__nk = { give: n => { gain(n); applyGear(); update(); }, buyAll: () => { ALL.forEach(u => S.own[u.id] = Math.max(own(u.id), u.id === 'clone' ? 8 : 1)); applyGear(); renderShop(); }, setChar };
})();
</script>
</body>
</html>
